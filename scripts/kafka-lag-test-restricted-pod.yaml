apiVersion: v1
kind: Pod
metadata:
  name: kafka-lag-tester
  namespace: REPLACE_KAFKA_NAMESPACE
  labels:
    app: kafka-lag-tester
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: kafka-lag-tester
      image: REPLACE_KAFKA_IMAGE
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "sleep 7d"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
