apiVersion: v1
kind: Namespace
metadata:
  name: monlog
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    # Adjust these labels to your cluster policy.
    # kube-prometheus-stack may require privileged namespace in some environments because node-exporter uses host access.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
