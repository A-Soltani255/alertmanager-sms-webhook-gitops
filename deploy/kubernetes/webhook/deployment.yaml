apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-webhook-alertmanager
  namespace: monlog
  labels:
    app: sms-webhook-alertmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sms-webhook-alertmanager
  template:
    metadata:
      labels:
        app: sms-webhook-alertmanager
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sms-webhook-alertmanager
          image: REGISTRY.example.com/prometheus/webhook/sms-webhook-alertmanager:1.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: sms-webhook-secret
            - configMapRef:
                name: sms-webhook-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
